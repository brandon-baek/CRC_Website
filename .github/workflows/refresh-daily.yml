name: Daily bulletin and daytime news
on:
  schedule:
    - cron: '0 6 * * *'
      timezone: America/Los_Angeles
    - cron: '7,37 6-16 * * *'
      timezone: America/Los_Angeles
    - cron: '7 0-5,17-23 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
  push:
    branches: [main, codex/daily-refresh]
    paths:
      - '.github/workflows/refresh-daily.yml'
      - 'scripts/refresh-daily.ts'
      - 'scripts/publish-daily.mjs'
      - 'scripts/daily-window.mjs'
      - 'scripts/daily-capture/**'
      - 'src/data/dailySchedule.ts'
      - 'src/data/dailyNews.ts'
      - 'src/data/dailySelection.ts'
      - 'src/data/directDaily.ts'
      - 'src/data/dailyEditorial.ts'
      - 'src/data/dailyPublication.ts'
      - 'src/data/sportsEntertainment.ts'
permissions:
  contents: write
concurrency:
  group: daily-bulletin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Determine morning, daytime, or overnight mode
        id: edition
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {refreshMode} from './scripts/daily-window.mjs';
          const saved=JSON.parse(fs.readFileSync('src/data/dailyEdition.json','utf8'));
          const mode=refreshMode(saved);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`mode=${mode}\n`);
          console.log(`Refresh mode: ${mode}`);
          NODE
      - name: Install news tools
        run: npm ci
      - name: Install image capture tools for the morning package
        if: steps.edition.outputs.mode == 'full'
        run: |
          npm ci --prefix scripts/daily-capture
          node scripts/daily-capture/node_modules/playwright/cli.js install --with-deps chromium
      - name: Collect or hold the latest news
        env:
          DAILY_MODE: ${{ steps.edition.outputs.mode }}
        run: node node_modules/tsx/dist/cli.mjs scripts/refresh-daily.ts
      - name: Validate schedule and stock-report handling
        run: |
          node node_modules/tsx/dist/cli.mjs scripts/test-daily-schedule.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-daily-selection.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-direct-daily.ts
      - name: Validate sports and entertainment selection
        run: node node_modules/tsx/dist/cli.mjs scripts/test-sports-entertainment.ts
      - name: Validate editorial exclusions and reporter authorship
        run: |
          node node_modules/tsx/dist/cli.mjs scripts/test-news-editorial.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-news-authors.ts
      - name: Validate the website before publishing
        if: steps.edition.outputs.mode != 'hold'
        run: npm run build
      - name: Publish daytime news or save overnight discoveries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DAILY_BRANCH: ${{ github.ref_name }}
        run: node scripts/publish-daily.mjs
