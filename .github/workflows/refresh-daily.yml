name: Daily bulletin at 6am Pacific
on:
  schedule:
    - cron: '0 6 * * *'
      timezone: America/Los_Angeles
    # Retry only if the edition or today's fortune was unavailable at 6am.
    - cron: '20 6,7 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
  push:
    branches: [main, codex/daily-refresh]
    paths:
      - '.github/workflows/refresh-daily.yml'
      - 'scripts/refresh-daily.ts'
      - 'scripts/publish-daily.mjs'
      - 'scripts/daily-capture/**'
      - 'src/data/dailySchedule.ts'
permissions:
  contents: write
concurrency:
  group: daily-bulletin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check whether a retry is needed
        id: edition
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const saved=JSON.parse(fs.readFileSync('src/data/dailyEdition.json','utf8'));
          const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const retry=process.env.EVENT_NAME==='schedule' && process.env.SCHEDULE==='20 6,7 * * *';
          const needed=!retry || saved?.editionDate!==today || !saved?.fortune;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`needed=${needed}\n`);
          NODE
      - name: Install capture tools
        if: steps.edition.outputs.needed == 'true'
        run: |
          npm ci
          npm ci --prefix scripts/daily-capture
          node scripts/daily-capture/node_modules/playwright/cli.js install --with-deps chromium
      - name: Collect the complete daily package
        if: steps.edition.outputs.needed == 'true'
        run: node node_modules/tsx/dist/cli.mjs scripts/refresh-daily.ts
      - name: Validate the website with the new edition
        if: steps.edition.outputs.needed == 'true'
        run: |
          node node_modules/tsx/dist/cli.mjs scripts/test-daily-schedule.ts
          npm run build
      - name: Save the edition and trigger Cloudflare Pages
        if: steps.edition.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DAILY_BRANCH: ${{ github.ref_name }}
        run: node scripts/publish-daily.mjs
